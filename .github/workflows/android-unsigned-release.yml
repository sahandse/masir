name: Build Unsigned Android Release

on:
  push:
    branches: [ main ]
    paths:
      - release/unsigned-request.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --no-pub --platforms=android --org ir.sahand .
          rm -f test/widget_test.dart
      - name: Apply Masir launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android_icon/masir_app_icon.xml android/app/src/main/res/drawable/masir_app_icon.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/masir_app_icon"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build release APK/AAB
        run: |
          flutter build apk --release --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de --dart-define=MASIR_OFFLINE_CATALOG_URL=https://raw.githubusercontent.com/sahandse/masir/main/offline/catalog.json
          flutter build appbundle --release --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de --dart-define=MASIR_OFFLINE_CATALOG_URL=https://raw.githubusercontent.com/sahandse/masir/main/offline/catalog.json
          cp build/app/outputs/flutter-apk/app-release.apk masir-v1.2.0-unsigned.apk
          cp build/app/outputs/bundle/release/app-release.aab masir-v1.2.0-unsigned.aab
      - name: Publish temporary unsigned build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-unsigned
          name: Masir v1.2.0 unsigned build
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Temporary unsigned build used only for local signing.
          files: |
            masir-v1.2.0-unsigned.apk
            masir-v1.2.0-unsigned.aab
