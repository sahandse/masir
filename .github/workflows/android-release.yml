name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org ir.sahand .
          rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
      - name: Build release AAB
        run: flutter build appbundle --release --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
      - name: Rename release files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk masir-v0.8.0.apk
          cp build/app/outputs/bundle/release/app-release.aab masir-v0.8.0.aab
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masir-android-v0.8.0
          path: |
            masir-v0.8.0.apk
            masir-v0.8.0.aab
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0
          name: Masir v0.8.0
          target_commitish: main
          generate_release_notes: true
          body: |
            مسیر v0.8.0

            - Lane Guidance واقعی از داده Valhalla در صورت ارائه توسط مسیر
            - نمایش نام خیابان بعدی و اطلاعات خروجی
            - آیکون‌های حرفه‌ای برای پیچ، خروجی، میدان و ادامه مسیر
            - Navigation Banner جدید، مینیمال و مناسب رانندگی
            - ETA، فاصله باقی‌مانده و سرعت زنده
            - دیتای واقعی OpenStreetMap / Nominatim / Overpass
            - مسیریابی و Re-route واقعی Valhalla
            - بدون Demo/Fake Data برای مسیر و مکان‌ها
          files: |
            masir-v0.8.0.apk
            masir-v0.8.0.aab
