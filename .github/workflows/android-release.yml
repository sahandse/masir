name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: masir-android-release-v0.9.0
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.MASIR_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MASIR_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MASIR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify release signing secrets
        run: |
          test -n "${{ secrets.MASIR_KEYSTORE_BASE64 }}"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org ir.sahand .
          rm -f test/widget_test.dart
      - name: Apply Masir launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android_icon/masir_app_icon.xml android/app/src/main/res/drawable/masir_app_icon.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/masir_app_icon"#' android/app/src/main/AndroidManifest.xml
      - name: Configure stable Android signing
        run: |
          echo '${{ secrets.MASIR_KEYSTORE_BASE64 }}' | base64 --decode > android/app/upload-keystore.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          old = 'signingConfig = signingConfigs.getByName("debug")'
          new = '''signingConfig = signingConfigs.create("release") {\n            storeFile = file("upload-keystore.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }'''
          if old not in s:
              raise SystemExit('Flutter release signing placeholder not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
      - name: Build release AAB
        run: flutter build appbundle --release --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
      - name: Rename release files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk masir-v0.9.0.apk
          cp build/app/outputs/bundle/release/app-release.aab masir-v0.9.0.aab
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masir-android-v0.9.0
          path: |
            masir-v0.9.0.apk
            masir-v0.9.0.aab
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          name: Masir v0.9.0
          target_commitish: main
          generate_release_notes: true
          body: |
            مسیر v0.9.0

            - Driver Mode V3 مینیمال و حرفه‌ای
            - Lane Guidance واقعی در صورت ارائه داده توسط Valhalla
            - پیش‌نمایش مانور بعدی، نام خیابان و خروجی
            - ETA، سرعت و فاصله زنده
            - راهنمای صوتی فارسی چندمرحله‌ای
            - جستجو در امتداد مسیر
            - هشدارهای واقعی OSM برای construction / restriction / barrier / toll / ferry
            - اطلاعات واقعی OSM / Nominatim / Overpass / Valhalla
            - بدون Demo/Fake Data برای مسیر و مکان‌ها
            - امضای ثابت Android برای آپدیت نسخه‌های بعدی
          files: |
            masir-v0.9.0.apk
            masir-v0.9.0.aab
