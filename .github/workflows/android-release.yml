name: Android Production Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MASIR_UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.MASIR_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "Missing MASIR_UPLOAD_KEYSTORE_BASE64 or MASIR_KEY_PROPERTIES secrets"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/masir-upload.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build signed release APK
        env:
          VALHALLA_BASE_URL: ${{ secrets.VALHALLA_BASE_URL }}
        run: |
          if [ -z "$VALHALLA_BASE_URL" ]; then
            echo "Missing VALHALLA_BASE_URL secret (production routing server)"
            exit 1
          fi
          flutter build apk --release --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL"
      - name: Build signed release AAB
        env:
          VALHALLA_BASE_URL: ${{ secrets.VALHALLA_BASE_URL }}
        run: flutter build appbundle --release --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL"
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masir-android-production-v1.0.1
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
