name: Android Release

on:
  push:
    tags: ['v*']
    branches: [ main ]
    paths:
      - release/request.txt
  workflow_dispatch:

concurrency:
  group: masir-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.MASIR_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.MASIR_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MASIR_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MASIR_KEY_PASSWORD }}
      OFFLINE_CATALOG_URL: https://raw.githubusercontent.com/sahandse/masir/main/offline/catalog.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify stable release signing
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Generate Android project files
        run: |
          flutter create --no-pub --platforms=android --org ir.sahand .
          rm -f test/widget_test.dart

      - name: Apply Masir launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android_icon/masir_app_icon.xml android/app/src/main/res/drawable/masir_app_icon.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/masir_app_icon"#' android/app/src/main/AndroidManifest.xml

      - name: Configure stable Android signing
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          old = 'signingConfig = signingConfigs.getByName("debug")'
          new = '''signingConfig = signingConfigs.create("release") {
              storeFile = file("upload-keystore.jks")
              storePassword = System.getenv("KEYSTORE_PASSWORD")
              keyAlias = System.getenv("KEY_ALIAS")
              keyPassword = System.getenv("KEY_PASSWORD")
          }'''
          if old not in s:
              raise SystemExit('Flutter release signing placeholder not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
          --dart-define=MASIR_OFFLINE_CATALOG_URL=$OFFLINE_CATALOG_URL

      - name: Build release AAB
        run: >
          flutter build appbundle --release
          --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
          --dart-define=MASIR_OFFLINE_CATALOG_URL=$OFFLINE_CATALOG_URL

      - name: Rename release files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk "masir-v$VERSION.apk"
          cp build/app/outputs/bundle/release/app-release.aab "masir-v$VERSION.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masir-android-v${{ steps.version.outputs.version }}
          path: |
            masir-v${{ steps.version.outputs.version }}.apk
            masir-v${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Masir ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            مسیر ${{ steps.release_tag.outputs.tag }}

            - مسیریابی خودرو، پیاده و دوچرخه
            - راهنمای شهر با داده واقعی OpenStreetMap
            - نقشه آفلاین PMTiles و مدیریت دانلود منطقه
            - Driver Mode و Lane Guidance
            - داده واقعی OSM / Nominatim / Overpass / Valhalla
            - بدون Demo/Fake Data
            - امضای ثابت Android برای آپدیت نسخه‌های بعدی
          files: |
            masir-v${{ steps.version.outputs.version }}.apk
            masir-v${{ steps.version.outputs.version }}.aab
