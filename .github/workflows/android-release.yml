name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android project files
        run: |
          flutter create --platforms=android --org ir.sahand .
          rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build free release APK
        run: >
          flutter build apk --release
          --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
      - name: Build free release AAB
        run: >
          flutter build appbundle --release
          --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masir-android-free-v0.8.0
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
