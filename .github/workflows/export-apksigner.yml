name: Export Android Apksigner

on:
  push:
    branches: [ main ]
    paths:
      - release/apksigner-request.txt

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect apksigner jar
        run: |
          TOOL="$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -1)"
          test -n "$TOOL"
          cp "$TOOL" apksigner.jar
          ls -lh apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner
          path: apksigner.jar
          if-no-files-found: error
