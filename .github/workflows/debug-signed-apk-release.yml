name: Debug-Signed APK Release

on:
  workflow_dispatch:
    inputs:
      report_api_base_url:
        description: Optional community reports server (leaving it empty keeps reports local-only)
        required: false
        default: ""

concurrency:
  group: masir-apk-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      OFFLINE_CATALOG_URL: https://raw.githubusercontent.com/sahandse/masir/main/offline/catalog.json
      REPORT_API_BASE_URL: ${{ github.event.inputs.report_api_base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --no-pub --platforms=android --org ir.sahand .
          rm -f test/widget_test.dart

      - name: Apply Masir launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android_icon/masir_app_icon.xml android/app/src/main/res/drawable/masir_app_icon.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/masir_app_icon"#' android/app/src/main/AndroidManifest.xml

      - name: Enable on-demand Android speech recognition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        shell: bash
        run: |
          ARGS="--release"
          ARGS="$ARGS --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de"
          ARGS="$ARGS --dart-define=MASIR_OFFLINE_CATALOG_URL=$OFFLINE_CATALOG_URL"
          if [ -n "$REPORT_API_BASE_URL" ]; then
            ARGS="$ARGS --dart-define=REPORT_API_BASE_URL=$REPORT_API_BASE_URL"
          fi
          flutter build apk $ARGS

      - name: Name the APK
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk "masir-v$VERSION-debug-signed.apk"
          ls -lh "masir-v$VERSION-debug-signed.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masir-apk-v${{ steps.version.outputs.version }}
          path: masir-v${{ steps.version.outputs.version }}-debug-signed.apk
          if-no-files-found: error

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Masir v${{ steps.version.outputs.version }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            مسیر v${{ steps.version.outputs.version }} — فایل APK قابل نصب

            - گزارش‌های جامعه‌ای سبک Waze: ثبت سریع اتفاق، هشدار گزارش پیشِ رو روی مسیر، تأیید و تکذیب
            - صف آفلاین گزارش‌ها و انقضای خودکار بر اساس نوع گزارش
            - سرور خودمیزبان گزارش‌ها در پوشه `server/` (اختیاری؛ بدون آن گزارش‌ها محلی می‌مانند)
            - یکنواخت‌سازی موتور مسیریابی راننده و مکان‌نمای خودکار هنگام شروع
            - مسیریابی خودرو، پیاده و دوچرخه با داده واقعی OSM / Nominatim / Overpass / Valhalla
            - بدون Demo/Fake Data

            این فایل با کلید debug امضا شده است (چون keystore منتشر عمومی در Secrets مخزن تعریف نشده). قابل نصب است، اما اگر نسخه امضاشدهٔ دیگری روی دستگاه نصب باشد باید ابتدا حذف شود. برای انتشار stable با امضای ثابت، Secrets مربوط به keystore را اضافه کنید و workflow «Android Release» را اجرا کنید.
          files: |
            masir-v${{ steps.version.outputs.version }}-debug-signed.apk
