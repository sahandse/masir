name: Market Release Artifact Build

on:
  push:
    branches: [ main ]
    paths:
      - release/market-build-request.txt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --no-pub --platforms=android --org ir.sahand .
          rm -f test/widget_test.dart
      - name: Apply Masir launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android_icon/masir_app_icon.xml android/app/src/main/res/drawable/masir_app_icon.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/masir_app_icon"#' android/app/src/main/AndroidManifest.xml
      - name: Enable on-demand Android speech recognition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK and AAB
        run: |
          flutter build apk --release \
            --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de \
            --dart-define=MASIR_OFFLINE_CATALOG_URL=https://raw.githubusercontent.com/sahandse/masir/main/offline/catalog.json
          flutter build appbundle --release \
            --dart-define=VALHALLA_BASE_URL=https://valhalla1.openstreetmap.de \
            --dart-define=MASIR_OFFLINE_CATALOG_URL=https://raw.githubusercontent.com/sahandse/masir/main/offline/catalog.json
          cp build/app/outputs/flutter-apk/app-release.apk masir-v1.3.0-unsigned.apk
          cp build/app/outputs/bundle/release/app-release.aab masir-v1.3.0-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: masir-market-v1.3.0-unsigned
          path: |
            masir-v1.3.0-unsigned.apk
            masir-v1.3.0-unsigned.aab
          if-no-files-found: error
