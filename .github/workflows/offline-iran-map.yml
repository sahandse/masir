name: Build Iran Offline Map

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masir-offline-iran
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install PMTiles CLI
        run: |
          go install github.com/protomaps/go-pmtiles@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Download Iran Shortbread MBTiles from Geofabrik
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            -o iran-shortbread-1.0.mbtiles \
            https://download.geofabrik.de/asia/iran-shortbread-1.0.mbtiles
          test -s iran-shortbread-1.0.mbtiles

      - name: Convert and verify PMTiles
        run: |
          pmtiles convert iran-shortbread-1.0.mbtiles iran-shortbread-1.0.pmtiles
          pmtiles verify iran-shortbread-1.0.pmtiles
          sha256sum iran-shortbread-1.0.pmtiles | tee iran-shortbread-1.0.pmtiles.sha256

      - name: Prepare metadata
        id: meta
        run: |
          VERSION="$(date -u +%Y.%m.%d)"
          UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BYTES="$(stat -c%s iran-shortbread-1.0.pmtiles)"
          SHA="$(cut -d' ' -f1 iran-shortbread-1.0.pmtiles.sha256)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "updated_at=$UPDATED_AT" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish/update offline map release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="offline-maps-iran"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Masir Offline Maps — Iran" \
              --notes "Iran Shortbread vector map derived from OpenStreetMap data distributed by Geofabrik. © OpenStreetMap contributors."
          gh release upload "$TAG" \
            iran-shortbread-1.0.pmtiles \
            iran-shortbread-1.0.pmtiles.sha256 \
            --clobber

      - name: Update offline catalog
        run: |
          mkdir -p offline
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "schema": 1,
              "source": "OpenStreetMap / Geofabrik Shortbread",
              "updated_at": "${{ steps.meta.outputs.updated_at }}",
              "regions": [
                  {
                      "id": "iran",
                      "title": "ایران",
                      "file_name": "iran-shortbread-1.0.pmtiles",
                      "download_url": "https://github.com/sahandse/masir/releases/download/offline-maps-iran/iran-shortbread-1.0.pmtiles",
                      "bytes": int("${{ steps.meta.outputs.bytes }}"),
                      "sha256": "${{ steps.meta.outputs.sha }}",
                      "version": "${{ steps.meta.outputs.version }}",
                      "updated_at": "${{ steps.meta.outputs.updated_at }}"
                  }
              ]
          }
          Path("offline/catalog.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- offline/catalog.json; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/catalog.json
          git commit -m "Update Iran offline map catalog"
          git push origin HEAD:main
