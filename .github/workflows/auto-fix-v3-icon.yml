name: One-shot V3 icon fix

on:
  push:
    branches: [ feature/v0.9-all-navigation-upgrades ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'auto-fix-v3-icon') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9-all-navigation-upgrades
      - name: Patch unsupported Material icon
        run: |
          sed -i 's/Icons\.do_not_enter_rounded/Icons.block_rounded/g' lib/features/map/presentation/navigation_experience_v3_page.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/map/presentation/navigation_experience_v3_page.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto-fix-v3-icon: use compatible restricted-route icon'
          git push origin HEAD:feature/v0.9-all-navigation-upgrades
