name: Build Iran Offline Map

on:
  workflow_dispatch:
    inputs:
      map_version:
        description: Offline map version, for example 2026.10
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: masir-offline-map-iran
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h

      - name: Download current Iran OSM extract
        run: |
          curl --fail --location --retry 4             -o iran-latest.osm.pbf             https://download.geofabrik.de/asia/iran-latest.osm.pbf

      - name: Build PMTiles from real OSM data
        run: |
          mkdir -p tilemaker-store
          docker run --rm             -v "$PWD:/data"             ghcr.io/systemed/tilemaker:master             /data/iran-latest.osm.pbf             --output /data/iran.pmtiles             --store /data/tilemaker-store

      - name: Verify generated archive
        run: |
          test -s iran.pmtiles
          SHA=$(sha256sum iran.pmtiles | awk '{print $1}')
          BYTES=$(stat -c%s iran.pmtiles)
          echo "OFFLINE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "OFFLINE_BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "PMTiles size: $BYTES bytes"

      - name: Build catalog
        env:
          MAP_VERSION: ${{ inputs.map_version }}
        run: |
          TAG="offline-iran-$MAP_VERSION"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/iran.pmtiles"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          version = os.environ["MAP_VERSION"]
          tag = f"offline-iran-{version}"
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "schema": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source": "OpenStreetMap / Geofabrik",
              "attribution": "© OpenStreetMap contributors",
              "regions": [{
                  "id": "iran",
                  "title": "ایران",
                  "file_name": "iran.pmtiles",
                  "download_url": f"https://github.com/{repo}/releases/download/{tag}/iran.pmtiles",
                  "bytes": int(os.environ["OFFLINE_BYTES"]),
                  "sha256": os.environ["OFFLINE_SHA"],
                  "version": version,
                  "updated_at": datetime.now(timezone.utc).isoformat()
              }]
          }
          with open("offline_maps/catalog.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit catalog update
        env:
          MAP_VERSION: ${{ inputs.map_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline_maps/catalog.json
          git commit -m "Update Iran offline map catalog $MAP_VERSION" || true
          git push origin HEAD:main

      - name: Publish offline data release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-iran-${{ inputs.map_version }}
          name: Iran Offline Map ${{ inputs.map_version }}
          target_commitish: main
          body: |
            بسته نقشه آفلاین ایران برای اپ مسیر.
            داده: OpenStreetMap / Geofabrik.
            Attribution: © OpenStreetMap contributors.
          files: iran.pmtiles
